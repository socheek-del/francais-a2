<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Exercices et fiches de règles de grammaire française, niveau A2.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230b6e66%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22700%22%3EA2%3C/text%3E%3C/svg%3E">
<title>Grammaire A2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: workbook. Left rail = numbered chapter list from the PDF with progress; right = rule card + one-question-at-a-time drill. Phone: list and chapter are separate views. */
:root {
  --bg: #eef3f3;
  --surface: #ffffff;
  --sunk: #e3eaea;
  --line: #cfdadb;
  --fg: #11221f;
  --muted: #566a67;
  --accent: #0b6e66;
  --accent-ink: #ffffff;
  --accent-soft: #d5ece9;
  --ok: #1d7f45;
  --ok-soft: #dff2e6;
  --bad: #b8323a;
  --bad-soft: #f8e3e4;
  --warn: #9a6207;
  --warn-soft: #f8ecd6;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1615; --surface: #13211f; --sunk: #0f1b1a; --line: #263a37; --fg: #e3eeec; --muted: #8fa6a2;
  --accent: #4fc4b7; --accent-ink: #062320; --accent-soft: #173a36;
  --ok: #5fd08f; --ok-soft: #133524; --bad: #ff8a90; --bad-soft: #3d1b1f; --warn: #f0b85c; --warn-soft: #3a2a10; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0c1615; --surface: #13211f; --sunk: #0f1b1a; --line: #263a37; --fg: #e3eeec; --muted: #8fa6a2;
  --accent: #4fc4b7; --accent-ink: #062320; --accent-soft: #173a36;
  --ok: #5fd08f; --ok-soft: #133524; --bad: #ff8a90; --bad-soft: #3d1b1f; --warn: #f0b85c; --warn-soft: #3a2a10; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; cursor: pointer; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.app { max-width: 1120px; margin: 0 auto; padding-block: 24px 56px; display: flex; flex-direction: column; gap: 20px }

.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1; margin: 0; letter-spacing: -0.02em }
.src { color: var(--muted); margin: 6px 0 0; font-size: 0.95rem }
.overall { display: flex; gap: 22px; align-items: flex-end }
.stat { display: flex; flex-direction: column; align-items: flex-end }
.stat b { font-family: var(--font-display); font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700 }
.meter { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s }

.grid { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 22px; align-items: start }
.rail { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto }
.rail h2 { font-family: var(--font-display); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 12px 10px 6px }
.topic { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 10px }
.topic:hover { background: var(--sunk) }
.topic[aria-current="true"] { background: var(--accent-soft) }
.topic .num { font-family: var(--font-display); font-weight: 600; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums }
.topic .name { font-weight: 600; font-size: 0.95rem; line-height: 1.25; min-width: 0 }
.topic .meter { grid-column: 2 / 3; height: 4px }
.topic .score { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; grid-row: 1 / 3; grid-column: 3 }
.state { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--line); margin-right: 6px; vertical-align: 1px }
.state.s1 { background: var(--warn) } .state.s2 { background: var(--ok) }

.main { display: flex; flex-direction: column; gap: 16px; min-width: 0 }
.back { display: none; align-self: flex-start; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 9px; font-size: 0.9rem; color: var(--muted) }
.chap-head { display: flex; flex-direction: column; gap: 4px }
.chap-head .label { color: var(--accent) }
.chap-head h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em }

details.rule { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 18px }
details.rule summary { cursor: pointer; padding: 14px 0; font-weight: 700; list-style: none; display: flex; justify-content: space-between }
details.rule summary::-webkit-details-marker { display: none }
details.rule summary::after { content: "Afficher"; color: var(--accent); font-weight: 600; font-size: 0.9rem }
details.rule[open] summary::after { content: "Masquer" }
.rule-body { padding-bottom: 16px; display: flex; flex-direction: column; gap: 8px; max-width: 70ch }
.rule-body p { margin: 0 }
.rule-body .ex { display: flex; flex-direction: column; padding: 6px 12px; border-left: 3px solid var(--accent-soft); }
.rule-body .ex i { color: var(--muted); font-size: 0.92rem }
.rule-body .tbl { overflow-x: auto }
.rule-body table { border-collapse: collapse; font-size: 0.95rem }
.rule-body td, .rule-body th { border-bottom: 1px solid var(--line); padding: 5px 12px 5px 0; text-align: left; white-space: nowrap }
.rule-body th { color: var(--muted); font-weight: 600 }

.drill { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 16px }
.drill-top { display: flex; align-items: center; gap: 12px }
.drill-top .meter { flex: 1; height: 8px }
.drill-top .count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.9rem }
.kind { font-size: 0.8rem; color: var(--muted) }
.q { font-size: clamp(1.2rem, 3.4vw, 1.5rem); line-height: 1.4; font-weight: 600; text-wrap: pretty }
.q .blank { display: inline-block; min-width: 3.5em; border-bottom: 2.5px solid var(--accent); margin: 0 2px }
.q .filled { color: var(--ok); border-bottom: 2.5px solid var(--ok); padding: 0 2px }
.q-en { color: var(--muted); font-style: italic; margin-top: -8px }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px }
.opt { display: flex; gap: 10px; align-items: baseline; text-align: left; border: 1.5px solid var(--line); background: var(--bg); padding: 12px 14px; border-radius: 12px; font-size: 1.05rem }
.opt:hover:not(:disabled) { border-color: var(--accent) }
.opt kbd { font-family: var(--font-body); font-size: 0.75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; flex-shrink: 0 }
.opt.right { border-color: var(--ok); background: var(--ok-soft) }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft) }
.opt:disabled { cursor: default }
.fill-row { display: flex; gap: 8px; flex-wrap: wrap }
#ans { flex: 1 1 240px; min-width: 0; font: inherit; font-size: 1.2rem; padding: 10px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg) }
#ans:focus { outline: none; border-color: var(--accent) }
#ans.ok { border-color: var(--ok) } #ans.bad { border-color: var(--bad) } #ans.near { border-color: var(--warn) }
.accents { display: flex; flex-wrap: wrap; gap: 6px }
.accents button { min-width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 1rem }
.fb { border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px }
.fb.ok { background: var(--ok-soft) } .fb.bad { background: var(--bad-soft) } .fb.near { background: var(--warn-soft) }
.fb strong { color: var(--ok) } .fb.bad strong { color: var(--bad) } .fb.near strong { color: var(--warn) }
.fb .ansline { font-weight: 700 }
.fb .why { color: var(--muted); font-size: 0.95rem }
.actions { display: flex; gap: 10px; flex-wrap: wrap }
.primary { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 11px 20px; border-radius: 11px }
.ghost { border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 10px 16px; border-radius: 11px; font-size: 0.95rem }
.summary { display: flex; flex-direction: column; gap: 14px; align-items: flex-start }
.summary .big { font-family: var(--font-display); font-size: 2.6rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums }
.missed { display: flex; flex-direction: column; gap: 6px; width: 100% }
.missed div { background: var(--bad-soft); border-radius: 9px; padding: 8px 12px; font-size: 0.95rem }
.missed div b { color: var(--bad) }
.dots { display: flex; flex-wrap: wrap; gap: 4px }
.dots i { width: 10px; height: 10px; border-radius: 3px; background: var(--line) }
.dots i.r { background: var(--ok) } .dots i.w { background: var(--bad) }
.foot { display: flex; justify-content: flex-end }

.viewtabs { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; align-self: flex-start }
.viewtabs button { border: 0; background: transparent; color: var(--muted); padding: 8px 18px; border-radius: 9px; font-weight: 700 }
.viewtabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }
.search { padding: 6px 6px 2px }
#q { width: 100%; font: inherit; font-size: 0.95rem; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg) }
#q:focus { outline: none; border-color: var(--accent) }
.hit { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 10px }
.hit:hover { background: var(--sunk) }
.hit .where { font-size: 0.78rem; color: var(--muted); font-weight: 700 }
.hit .snip { font-size: 0.9rem; display: block }
mark { background: var(--warn-soft); color: var(--fg); border-radius: 3px; padding: 0 1px }
.hint { color: var(--muted); font-size: 0.85rem; padding: 6px 10px }

.book { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 6px 22px 22px; display: flex; flex-direction: column; gap: 10px }
.book h3 { font-family: var(--font-display); font-size: 1.2rem; margin: 18px 0 2px; scroll-margin-top: 16px; text-wrap: balance }
.book p { margin: 0; max-width: 72ch }
.book ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; max-width: 72ch }
.book .ex { display: flex; flex-direction: column; padding: 6px 12px; border-left: 3px solid var(--accent-soft) }
.book .ex i { color: var(--muted); font-size: 0.92rem }
.book .warn, .book .tip { border-radius: 10px; padding: 10px 14px; max-width: 72ch }
.book .warn { background: var(--bad-soft) } .book .warn b:first-child { color: var(--bad) }
.book .tip { background: var(--accent-soft) } .book .tip b:first-child { color: var(--accent) }
.book .tbl { overflow-x: auto }
.book table { border-collapse: collapse; font-size: 0.95rem }
.book td, .book th { border-bottom: 1px solid var(--line); padding: 6px 14px 6px 0; text-align: left; vertical-align: top }
.book th { color: var(--muted); font-weight: 600; white-space: nowrap }
.toc { display: flex; flex-wrap: wrap; gap: 6px }
.toc button { border: 1px solid var(--line); background: var(--surface); padding: 4px 11px; border-radius: 999px; font-size: 0.85rem; color: var(--muted) }
.toc button:hover { border-color: var(--accent); color: var(--accent) }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap }
a.ghost, a.primary { text-decoration: none; display: inline-block }

@media (max-width: 820px) {
  .grid { grid-template-columns: minmax(0, 1fr) }
  .rail { position: static; max-height: none }
  body.in-topic .rail { display: none }
  body:not(.in-topic) .main { display: none }
  .back { display: inline-block }
  .overall { gap: 16px }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }

.sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px }
.setcard { display: flex; flex-direction: column; gap: 4px; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 13px }
.setcard:hover { border-color: var(--accent) }
.setcard[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft) }
.st-title { font-weight: 700; line-height: 1.25 }
.st-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.3 }
.st-meta { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums }
.setcard .meter { height: 4px; margin-top: 2px }
.line { min-height: 54px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; border: 2px dashed var(--line); border-radius: 12px }
.line.ok { border-color: var(--ok); border-style: solid } .line.bad { border-color: var(--bad); border-style: solid }
.bank { display: flex; flex-wrap: wrap; gap: 8px }
.tile { border: 1.5px solid var(--line); background: var(--bg); border-radius: 9px; padding: 7px 12px; font-size: 1.05rem }
.tile:hover:not(:disabled) { border-color: var(--accent) }
.line .tile { background: var(--accent-soft); border-color: transparent }
.pairs-q { display: flex; flex-direction: column; gap: 8px }
.pair-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px 10px; border-radius: 10px; background: var(--bg) }
.pair-row span { font-weight: 600 }
.pair-row select { font: inherit; padding: 7px 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); min-width: 0 }
.pair-row.right { background: var(--ok-soft) } .pair-row.wrong { background: var(--bad-soft) }
.pair-row .fix { grid-column: 2; font-size: 0.85rem; color: var(--bad); font-weight: 700 }
</style>

</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <h1>Grammaire A2</h1>
      <p class="src">Exercices et fiches de règles pour le niveau A2. Ta progression reste dans ce navigateur.</p>
    </div>
    <div class="overall">
      <div class="stat"><b id="statTopics">0/35</b><span class="label">chapitres maîtrisés</span></div>
      <div class="stat"><b id="statEx">0/0</b><span class="label">exercices réussis</span></div>
    </div>
  </div>
  <div class="meter"><span id="overallBar" style="width:0%"></span></div>
  <div class="viewtabs" role="group" aria-label="Mode">
    <button id="vEx" aria-pressed="true">Exercices</button>
    <button id="vRules" aria-pressed="false">Règles</button>
  </div>

  <div class="grid">
    <nav class="rail" id="rail" aria-label="Chapitres"></nav>
    <main class="main" id="main"></main>
  </div>
  <div class="foot"><button class="ghost" id="resetAll">Effacer toute la progression</button></div>
</div>


<script src="js/grammar.js"></script>
<script src="js/verbs.js"></script>
<script src="js/book.js"></script>
<script src="js/sets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
